[project]
name = "rlcache"
version = "0.1.0"
description = "RL cache decision engine (TTL x eviction-priority x placement), J26-SE-302 Component 1"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "slow: long-running test (deselect with -m 'not slow')",
    "realdata: needs the downloaded Twitter sample shards under data/raw",
]
